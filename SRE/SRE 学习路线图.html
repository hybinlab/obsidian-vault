<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRE 学习路线图</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #f5f5f5;
    --color-ink:    #2d3142;
    --color-muted:  #4f5d75;
    --color-accent: #eb6c36;
    --font-sans:  'Geist', 'Noto Sans SC', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono:  'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1240px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--color-ink);
    margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 900px; display: block; }
  text { font-family: var(--font-sans); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Process Roadmap · Diagram Design</p>
  <h1>SRE 学习路线图</h1>

  <svg viewBox="0 0 1208 368" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sre-roadmap-title sre-roadmap-desc">
    <title id="sre-roadmap-title">SRE 学习路线图</title>
    <desc id="sre-roadmap-desc">已完成 Ansible 配置管理之后，按 ROI 顺序推进 Kubernetes、监控体系化、Terraform、CI/CD 四个阶段，编程语言深化与 SRE 理念作为贯穿全程的底层能力，不是独立阶段。</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ============ ARROWS (drawn before nodes) ============ -->
    <!-- n1 -> n2 (entering focal) -->
    <line x1="240" y1="96" x2="272" y2="96" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- n2 -> n3 (leaving focal) -->
    <line x1="472" y1="96" x2="504" y2="96" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <!-- n3 -> n4 -->
    <line x1="704" y1="96" x2="736" y2="96" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- n4 -> n5 -->
    <line x1="936" y1="96" x2="968" y2="96" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- ============ NODE 1 — 已完成 (Ansible) ============ -->
    <rect x="40" y="40" width="200" height="112" rx="6" fill="#f5f5f5"/>
    <rect x="40" y="40" width="200" height="112" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="48" y="52" width="44" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
    <text x="70" y="63" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DONE</text>
    <text x="140" y="92" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Ansible 配置管理</text>
    <text x="140" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">playbook · role · inventory</text>
    <text x="140" y="128" fill="#7a8399" font-size="9" text-anchor="middle">已系统学习</text>

    <!-- ============ NODE 2 — Kubernetes (FOCAL) ============ -->
    <rect x="272" y="40" width="200" height="112" rx="6" fill="#f5f5f5"/>
    <rect x="272" y="40" width="200" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <rect x="280" y="52" width="48" height="16" rx="2" fill="rgba(235,108,54,0.20)"/>
    <text x="304" y="63" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STEP 1</text>
    <text x="372" y="92" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Kubernetes</text>
    <text x="372" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">部署 · 调度 · 网络 · 存储</text>
    <text x="372" y="128" fill="#eb6c36" font-size="9" text-anchor="middle">SRE 岗位硬门槛</text>

    <!-- ============ NODE 3 — 监控体系化 ============ -->
    <rect x="504" y="40" width="200" height="112" rx="6" fill="#f5f5f5"/>
    <rect x="504" y="40" width="200" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="512" y="52" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="536" y="63" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STEP 2</text>
    <text x="604" y="88" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">监控体系化</text>
    <text x="604" y="106" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Prometheus + Grafana</text>
    <text x="604" y="122" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">日志 / 链路追踪</text>

    <!-- ============ NODE 4 — Terraform ============ -->
    <rect x="736" y="40" width="200" height="112" rx="6" fill="#f5f5f5"/>
    <rect x="736" y="40" width="200" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="744" y="52" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="768" y="63" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STEP 3</text>
    <text x="836" y="92" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Terraform</text>
    <text x="836" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">建资源：VM / 网络 / 存储</text>
    <text x="836" y="128" fill="#7a8399" font-size="9" text-anchor="middle">与 Ansible 组成 IaC 闭环</text>

    <!-- ============ NODE 5 — CI/CD ============ -->
    <rect x="968" y="40" width="200" height="112" rx="6" fill="#f5f5f5"/>
    <rect x="968" y="40" width="200" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="976" y="52" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
    <text x="1000" y="63" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STEP 4</text>
    <text x="1068" y="92" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">CI/CD</text>
    <text x="1068" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Jenkins / GitLab / Actions</text>
    <text x="1068" y="128" fill="#7a8399" font-size="9" text-anchor="middle">提交到生产全流程自动化</text>

    <!-- ============ BANNER — 贯穿全程 (dashed, non-step) ============ -->
    <rect x="40" y="192" width="1128" height="80" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="48" y="204" width="88" height="16" rx="2" fill="rgba(45,49,66,0.08)"/>
    <text x="92" y="215" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">贯穿全程</text>
    <text x="604" y="238" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">编程语言深化（Python / Go）+ SRE 理念</text>
    <text x="604" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SLI / SLO / error budget / toil 消减 / postmortem — 不是单独阶段</text>

    <!-- ============ LEGEND ============ -->
    <line x1="40" y1="304" x2="1168" y2="304" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="40" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <rect x="140" y="316" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="158" y="325" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">已完成</text>

    <rect x="260" y="316" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="278" y="325" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">关键阶段（SRE 硬门槛）</text>

    <rect x="480" y="316" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="498" y="325" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">待完成阶段</text>

    <rect x="620" y="316" width="12" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="638" y="325" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">贯穿全程（非独立阶段）</text>
  </svg>
</div>
</body>
</html>
