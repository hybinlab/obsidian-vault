<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="sans-serif">
  <style>
    .disk{fill:#eef2f7;stroke:#94a3b8;stroke-width:2;rx:6}
    .blk{stroke:#1e40af;stroke-width:1.5;rx:4}
    .lbl{font-size:14px;fill:#1e293b;text-anchor:middle}
    .t{font-size:16px;fill:#1e293b;text-anchor:middle;font-weight:bold}
  </style>
  <text class="t" x="260" y="24">RAID 0 · 条带化（无冗余）</text>

  <g>
    <!-- 4 disks -->
    <rect class="disk" x="20"  y="50" width="100" height="180"/>
    <rect class="disk" x="140" y="50" width="100" height="180"/>
    <rect class="disk" x="260" y="50" width="100" height="180"/>
    <rect class="disk" x="380" y="50" width="100" height="180"/>
    <text class="lbl" x="70"  y="45">Disk1</text>
    <text class="lbl" x="190" y="45">Disk2</text>
    <text class="lbl" x="310" y="45">Disk3</text>
    <text class="lbl" x="430" y="45">Disk4</text>

    <!-- stripe row A -->
    <rect class="blk" x="30"  y="60" width="80" height="40" fill="#93c5fd"/>
    <rect class="blk" x="150" y="60" width="80" height="40" fill="#93c5fd"/>
    <rect class="blk" x="270" y="60" width="80" height="40" fill="#93c5fd"/>
    <rect class="blk" x="390" y="60" width="80" height="40" fill="#93c5fd"/>
    <text class="lbl" x="70"  y="85">A1</text>
    <text class="lbl" x="190" y="85">A2</text>
    <text class="lbl" x="310" y="85">A3</text>
    <text class="lbl" x="430" y="85">A4</text>

    <!-- stripe row B -->
    <rect class="blk" x="30"  y="110" width="80" height="40" fill="#60a5fa"/>
    <rect class="blk" x="150" y="110" width="80" height="40" fill="#60a5fa"/>
    <rect class="blk" x="270" y="110" width="80" height="40" fill="#60a5fa"/>
    <rect class="blk" x="390" y="110" width="80" height="40" fill="#60a5fa"/>
    <text class="lbl" x="70"  y="135">B1</text>
    <text class="lbl" x="190" y="135">B2</text>
    <text class="lbl" x="310" y="135">B3</text>
    <text class="lbl" x="430" y="135">B4</text>
  </g>

  <text class="lbl" x="260" y="200" fill="#b91c1c">任意一块盘损坏 → 数据全部丢失</text>
  <text class="lbl" x="260" y="222" fill="#334155">写入吞吐 ≈ 单盘 × 4，容量 = n × 单盘</text>
</svg>
