<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="sans-serif">
  <style>
    .disk{fill:#eef2f7;stroke:#94a3b8;stroke-width:2;rx:6}
    .blk{stroke:#334155;stroke-width:1.5;rx:4}
    .lbl{font-size:14px;fill:#1e293b;text-anchor:middle}
    .t{font-size:16px;fill:#1e293b;text-anchor:middle;font-weight:bold}
  </style>
  <text class="t" x="260" y="24">RAID 6 · 双重校验（P + Q）</text>

  <rect class="disk" x="20"  y="50" width="100" height="220"/>
  <rect class="disk" x="140" y="50" width="100" height="220"/>
  <rect class="disk" x="260" y="50" width="100" height="220"/>
  <rect class="disk" x="380" y="50" width="100" height="220"/>
  <text class="lbl" x="70"  y="45">Disk1</text>
  <text class="lbl" x="190" y="45">Disk2</text>
  <text class="lbl" x="310" y="45">Disk3</text>
  <text class="lbl" x="430" y="45">Disk4</text>

  <!-- Row A: data data P Q -->
  <rect class="blk" x="30"  y="60" width="80" height="40" fill="#93c5fd"/><text class="lbl" x="70" y="85">A1</text>
  <rect class="blk" x="150" y="60" width="80" height="40" fill="#93c5fd"/><text class="lbl" x="190" y="85">A2</text>
  <rect class="blk" x="270" y="60" width="80" height="40" fill="#fbbf24"/><text class="lbl" x="310" y="85">Ap</text>
  <rect class="blk" x="390" y="60" width="80" height="40" fill="#fb923c"/><text class="lbl" x="430" y="85">Aq</text>

  <!-- Row B: data P Q data -->
  <rect class="blk" x="30"  y="110" width="80" height="40" fill="#60a5fa"/><text class="lbl" x="70" y="135">B1</text>
  <rect class="blk" x="150" y="110" width="80" height="40" fill="#fbbf24"/><text class="lbl" x="190" y="135">Bp</text>
  <rect class="blk" x="270" y="110" width="80" height="40" fill="#fb923c"/><text class="lbl" x="310" y="135">Bq</text>
  <rect class="blk" x="390" y="110" width="80" height="40" fill="#60a5fa"/><text class="lbl" x="430" y="135">B2</text>

  <!-- Row C: P Q data data -->
  <rect class="blk" x="30"  y="160" width="80" height="40" fill="#fbbf24"/><text class="lbl" x="70" y="185">Cp</text>
  <rect class="blk" x="150" y="160" width="80" height="40" fill="#fb923c"/><text class="lbl" x="190" y="185">Cq</text>
  <rect class="blk" x="270" y="160" width="80" height="40" fill="#3b82f6"/><text class="lbl" x="310" y="185">C1</text>
  <rect class="blk" x="390" y="160" width="80" height="40" fill="#3b82f6"/><text class="lbl" x="430" y="185">C2</text>

  <!-- Row D: Q data data P -->
  <rect class="blk" x="30"  y="210" width="80" height="40" fill="#fb923c"/><text class="lbl" x="70" y="235">Dq</text>
  <rect class="blk" x="150" y="210" width="80" height="40" fill="#2563eb"/><text class="lbl" x="190" y="235">D1</text>
  <rect class="blk" x="270" y="210" width="80" height="40" fill="#2563eb"/><text class="lbl" x="310" y="235">D2</text>
  <rect class="blk" x="390" y="210" width="80" height="40" fill="#fbbf24"/><text class="lbl" x="430" y="235">Dp</text>

  <text class="lbl" x="260" y="285" fill="#334155">黄=P校验，橙=Q校验，均轮转分布 · 可同时坏 2 块盘</text>
</svg>
